<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda</title>
  <link rel="stylesheet" href="estilização.css">
</head>
<body>
  <h1>Agenda</h1>
  <input id="tarefa" type="text" placeholder="Insira aqui sua tarefa">
  <input id="seleciona-data" type="date" />
  <button onclick="adicionarTarefa()">Adicionar Tarefa</button>
  <div id="lista-de-tarefas"></div>

  <script>
    let afazeres;

    if(Array.isArray(JSON.parse(localStorage.getItem("afazeres")))){
        afazeres = JSON.parse(localStorage.getItem("afazeres"))
    }else{
      afazeres = [
          { nome: "Lavar louça", data: "2025-08-15", id: "id1" },
          { nome: "Lavar banheiro", data: "2025-08-20", id: "id2" },
          { nome: "Estender roupa", data: "2025-08-25", id: "id3" },
          { nome: "Assistir o jogo do Corinthians", data: "2025-08-16", id: "id4" }
      ];
    };

    let salvartarefas = () => localStorage.setItem("afazeres", JSON.stringify(afazeres));
    salvartarefas();  

    let adicionarTarefa = () => {
        const campoTarefa = document.getElementById("tarefa");
        const tarefa = campoTarefa.value;

        const campoData = document.getElementById("seleciona-data");
        const prazo = campoData.value;

        if(tarefa === "" || prazo === ""){
          alert("Preencha a tarefa e a data!");
          return;
        }

        const cron = "" + new Date().getTime();

        afazeres.push({ nome: tarefa, data: prazo, id: cron });
        
        salvartarefas();
        rendenrizar();

        campoTarefa.value = "";
        campoData.value = "";
    }

    let apagarTarefa = (evento) => {
        const botaoapagar = evento.target;
        const idaserapagado = botaoapagar.id;
        afazeres = afazeres.filter((tarefa)=> tarefa.id !== idaserapagado);
        salvartarefas();
        rendenrizar();
    };

    let rendenrizar = () => {
        document.getElementById("lista-de-tarefas").innerHTML = "";
        afazeres.forEach((tarefa) => {
            const card = document.createElement("div");
            card.className = "card";

            const conteudo = document.createElement("div");
            conteudo.className = "conteudo";

            const titulo = document.createElement("div");
            titulo.className = "titulo";
            titulo.innerText = tarefa.nome;

            const data = document.createElement("div");
            data.className = "data";
            data.innerText = "Prazo: " + tarefa.data;

            conteudo.appendChild(titulo);
            conteudo.appendChild(data);

            const botaoapagar = document.createElement("button");
            botaoapagar.innerText = "Apagar";
            botaoapagar.id = tarefa.id;
            botaoapagar.onclick = apagarTarefa;

            card.appendChild(conteudo);
            card.appendChild(botaoapagar);

            const listaDeTarefas = document.getElementById("lista-de-tarefas");
            listaDeTarefas.appendChild(card);
        });
    }
    rendenrizar();
  </script>
</body>
</html>
